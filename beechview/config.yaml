name: BeechView
version: "1.3.1"
slug: beechview
description: Touch-friendly player for your Pinchflat shows, made for HomeView
url: https://github.com/Benjamin-Leo-Code/BeechView
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8888
panel_icon: mdi:television-play
panel_title: BeechView
watchdog: http://[HOST]:[PORT:8888]/api/health
# Read-only use: work mode reads the state of the entities listed below.
homeassistant_api: true
ports:
  8888/tcp: 8888
ports_description:
  8888/tcp: Web page for Safari on HomeView (no login needed)
map:
  - type: media
    read_only: true
options:
  media_path: "/media/Unraid/Videos/YouTube"
  rescan_seconds: 15
  work_mode: true
  work_entities:
    - binary_sensor.boot_room_working_day
    - schedule.work_schedule
  work_media_path: "/media/Unraid/Videos/YouTube/Work"
schema:
  media_path: str
  rescan_seconds: int(0,3600)
  work_mode: bool
  work_entities:
    - str
  work_media_path: str?
