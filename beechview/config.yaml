name: BeechView
version: "1.2.1"
slug: beechview
description: Touch-friendly player for your Pinchflat shows, made for HomeView
url: https://github.com/Benjamin-Leo-Code/BeechView
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:television-play
panel_title: BeechView
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web page for Safari on HomeView (no login needed)
map:
  - type: media
    read_only: true
options:
  media_path: "/media/unraid/pinchflat/shows (watch)"
  rescan_seconds: 15
schema:
  media_path: str
  rescan_seconds: int(0,3600)
